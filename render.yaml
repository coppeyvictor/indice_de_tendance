services:
  - type: cron
    name: indice-de-tendance-daily-collect
    runtime: python
    plan: free
    schedule: "0 12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python veille_presse.py --once
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SENTIMENT_PROVIDER
        value: local
